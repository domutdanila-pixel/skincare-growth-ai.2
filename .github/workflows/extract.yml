
name: Extract SkinGrow AI Website

on:
  workflow_dispatch:
  push:
    paths:
      - 'skingrow-ai-site.zip'
      - '.github/workflows/extract.yml'

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract website archive
        run: |
          python -m zipfile -e skingrow-ai-site.zip .

      - name: Commit extracted website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Extract SkinGrow AI website"
          git push

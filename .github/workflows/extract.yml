
name: Extract SkinGrow AI Website

on:
  workflow_dispatch:
  push:
    paths:
      - 'skingrow-ai-site.zip'
      - '.github/workflows/extract.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Extract website
        run: |
          python -m zipfile -e skingrow-ai-site.zip .

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Extract SkinGrow AI website"
          git push
